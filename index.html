<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Agenda Test</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>

    <h1>Agenda Test PWA</h1>
    <p>Klik op de knop om een afspraak direct naar je Android-agenda te sturen zonder downloads.</p>
    
    <br>
    <button id="addCalendar">Voeg afspraak toe aan agenda</button>

    <script>
        // Registreer de Service Worker zodat het een PWA wordt
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker geregistreerd!'))
                .catch((err) => console.log('Registratie mislukt:', err));
        }

        // De logica voor de afspraak
       document.getElementById('addCalendar').addEventListener('click', async () => {
    try {
        // 1. Maak de ICS-inhoud aan
        const icsData = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Test PWA//NL
BEGIN:VEVENT
SUMMARY:Test Afspraak PWA
DESCRIPTION:Werkt zonder downloads-map!
DTSTART:20260601T100000Z
DTEND:20260601T110000Z
END:VEVENT
END:VCALENDAR`;

        // 2. Zet om naar een bestand in het geheugen
        const file = new File([icsData], "afspraak.ics", { type: "text/calendar" });

        const shareData = {
            files: [file],
            title: 'Afspraak inplannen',
            text: 'Open deze afspraak direct in je agenda'
        };

        // 3. Controleer of het apparaat dit ondersteunt
        if (navigator.canShare && navigator.canShare(shareData)) {
            await navigator.share(shareData);
            console.log('Succesvol gedeeld!');
        } else {
            alert('Dit apparaat kan helaas geen bestanden delen via de browser.');
        }
    } catch (error) {
        // Als de gebruiker zelf op annuleren drukt, is dat geen echte fout
        if (error.name !== 'AbortError') {
            console.error('Deelfout:', error);
            alert('Fout bij delen: ' + error.message + '\n\nControleer of je via een veilige https:// verbinding kijkt.');
        }
    }
});
    </script>
</body>
</html>
