<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Agenda PWA Test</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>

    <h1>Samsung Agenda Test PWA</h1>
    <p>Klik op de knop om de Samsung Agenda direct te openen met een ingevulde afspraak.</p>
    
    <br>
    <button id="openSamsungCalendar">Open Samsung Agenda</button>

    <script>
        // Registreer de Service Worker zodat het een werkende PWA blijft
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker geregistreerd!'))
                .catch((err) => console.log('Registratie mislukt:', err));
        }

        // Zodra je op de knop klikt, wordt de Samsung Agenda direct aangeroepen
        document.getElementById('openSamsungCalendar').addEventListener('click', () => {
            const title = encodeURIComponent("Test Afspraak PWA");
            const description = encodeURIComponent("Beschrijving van de afspraak");
            const beginTime = "20260601T100000Z";
            const endTime = "20260601T110000Z";

            // Android Intent link specifiek voor de Samsung Agenda app
            const intentUrl = `intent://com.android.calendar/#Intent;action=android.intent.action.EDIT;type=vnd.android.cursor.item/event;S.title=${title};S.description=${description};l.beginTime=${beginTime};l.endTime=${endTime};package=com.samsung.android.calendar;end;`;

            // Stuur de browser door naar de Intent, wat de agenda opent
            window.location.href = intentUrl;
        });
    </script>
</body>
</html>
